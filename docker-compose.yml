x-airflow-common: &airflow-common
  build: ./airflow
  environment:
    &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://airflow:airflow@airflow-postgres:5432/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_SECRET_KEY}
    AIRFLOW__CORE__LOAD_EXAMPLES: 'false'
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: 'false'
    AIRFLOW__SCHEDULER__MIN_FILE_PROCESS_INTERVAL: '60'
    AIRFLOW__WEBSERVER__WORKERS: '1'
    AIRFLOW__WEBSERVER__WORKER_REFRESH_INTERVAL: '1800'
    AIRFLOW__SCHEDULER__PARSING_PROCESSES: '1'
    MINIO_ENDPOINT: http://minio:9000
    MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
    MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    CLICKHOUSE_HOST: clickhouse
    CLICKHOUSE_PORT: '8123'
    CLICKHOUSE_DB: crypto
    ICEBERG_REST_URI: http://iceberg-rest:8181
    ICEBERG_WAREHOUSE: s3://lakehouse/
  volumes:
    - ./airflow/dags:/opt/airflow/dags
    - ./scripts:/opt/airflow/scripts
    - airflow-logs:/opt/airflow/logs
    - airflow-plugins:/opt/airflow/plugins
  depends_on:
    airflow-postgres:
      condition: service_healthy
    iceberg-rest:
      condition: service_healthy
  networks:
    - crypto-net

services:
  # ─── Zookeeper ────────────────────────────────────────────────────────────────
  zookeeper:
    image: confluentinc/cp-zookeeper:7.6.1
    hostname: zookeeper
    container_name: zookeeper
    mem_limit: 512m
    environment:
      ZOOKEEPER_CLIENT_PORT: 2181
      ZOOKEEPER_TICK_TIME: 2000
      KAFKA_HEAP_OPTS: "-Xmx256m -Xms128m"
    healthcheck:
      test: echo srvr | nc localhost 2181 | grep -q Mode
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - crypto-net

  # ─── Kafka ────────────────────────────────────────────────────────────────────
  kafka:
    image: confluentinc/cp-kafka:7.6.1
    hostname: kafka
    container_name: kafka
    mem_limit: 1g
    depends_on:
      zookeeper:
        condition: service_healthy
    ports:
      - "9093:9093"
    environment:
      KAFKA_BROKER_ID: 1
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,PLAINTEXT_HOST://localhost:9093
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: PLAINTEXT:PLAINTEXT,PLAINTEXT_HOST:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: 'true'
      KAFKA_LOG_RETENTION_HOURS: 48
      KAFKA_LOG_SEGMENT_BYTES: 1073741824
      KAFKA_HEAP_OPTS: "-Xmx512m -Xms256m"
    healthcheck:
      test: kafka-broker-api-versions --bootstrap-server localhost:9092
      interval: 15s
      timeout: 10s
      retries: 10
    networks:
      - crypto-net

  # ─── Kafka UI ─────────────────────────────────────────────────────────────────
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    mem_limit: 384m
    depends_on:
      kafka:
        condition: service_healthy
    ports:
      - "8080:8080"
    environment:
      KAFKA_CLUSTERS_0_NAME: local
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
      KAFKA_CLUSTERS_0_ZOOKEEPER: zookeeper:2181
    networks:
      - crypto-net

  # ─── MinIO ────────────────────────────────────────────────────────────────────
  minio:
    image: minio/minio:latest
    container_name: minio
    mem_limit: 512m
    ports:
      - "9000:9000"
      - "9001:9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    healthcheck:
      test: curl -f http://localhost:9000/minio/health/live
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - crypto-net

  # MinIO bucket initializer
  minio-init:
    image: minio/mc:latest
    container_name: minio-init
    mem_limit: 128m
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set myminio http://minio:9000 ${MINIO_ROOT_USER} ${MINIO_ROOT_PASSWORD};
        mc mb --ignore-existing myminio/stg;
        mc mb --ignore-existing myminio/dds;
        mc mb --ignore-existing myminio/scripts;
        mc mb --ignore-existing myminio/lakehouse;
        mc anonymous set public myminio/stg;
        mc anonymous set public myminio/dds;
        mc anonymous set public myminio/lakehouse;
        echo 'MinIO buckets ready';
      "
    networks:
      - crypto-net

  # Spark removed — replaced by lightweight Python consumer (spark_streaming service)

  # ─── Iceberg REST catalog (metadata store for the DDS lakehouse tables) ───────
  # Talks HTTP only to Airflow's PyIceberg client — keeps SQLAlchemy 2.x out of
  # the Airflow image, since Airflow 2.8/Flask-AppBuilder needs SQLAlchemy <2.0.
  iceberg-rest:
    image: tabulario/iceberg-rest:1.6.0
    container_name: iceberg-rest
    mem_limit: 512m
    # Run as root so the process can write the SQLite catalog file to the
    # named volume (the volume's mount dir is root-owned; the image's default
    # uid 1000 can't create files there). Fine for a local dev/student stack.
    user: root
    depends_on:
      minio-init:
        condition: service_completed_successfully
    environment:
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD}
      AWS_REGION: us-east-1
      CATALOG_WAREHOUSE: s3://lakehouse/
      CATALOG_IO__IMPL: org.apache.iceberg.aws.s3.S3FileIO
      CATALOG_S3_ENDPOINT: http://minio:9000
      CATALOG_S3_PATH__STYLE__ACCESS: 'true'
      # Persist catalog metadata in a SQLite file on a volume, so table
      # registrations survive container restarts (default is in-memory).
      CATALOG_URI: jdbc:sqlite:file:/catalog/iceberg_catalog.db
    volumes:
      - iceberg-catalog:/catalog
    ports:
      - "8181:8181"
    # No curl/wget in this minimal image; use bash /dev/tcp as a port probe.
    healthcheck:
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/localhost/8181"]
      interval: 10s
      timeout: 5s
      retries: 15
      start_period: 15s
    networks:
      - crypto-net

  # ─── Airflow ──────────────────────────────────────────────────────────────────
  airflow-postgres:
    image: postgres:16
    container_name: airflow-postgres
    mem_limit: 384m
    environment:
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: airflow
      POSTGRES_DB: airflow
    volumes:
      - airflow-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: pg_isready -U airflow
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - crypto-net

  airflow-init:
    <<: *airflow-common
    container_name: airflow-init
    mem_limit: 512m
    command: >
      bash -c "
        airflow db init &&
        airflow users create
          --username admin
          --password admin
          --firstname Admin
          --lastname Admin
          --role Admin
          --email admin@example.com || true &&
        echo 'Airflow initialized'
      "
    restart: on-failure

  airflow-webserver:
    <<: *airflow-common
    container_name: airflow-webserver
    mem_limit: 2g
    command: webserver
    ports:
      - "8082:8080"
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    healthcheck:
      test: curl -f http://localhost:8080/health
      interval: 30s
      timeout: 15s
      retries: 20
      start_period: 60s
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    container_name: airflow-scheduler
    mem_limit: 1500m
    environment:
      <<: *airflow-env
    command: scheduler
    depends_on:
      airflow-postgres:
        condition: service_healthy
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  # ─── ClickHouse ───────────────────────────────────────────────────────────────
  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    container_name: clickhouse
    mem_limit: 1g
    ports:
      - "8123:8123"
      - "9002:9000"
    volumes:
      - ./clickhouse/init.sql:/docker-entrypoint-initdb.d/init.sql
      - ./clickhouse/users.xml:/etc/clickhouse-server/users.d/default-user.xml
      - clickhouse-data:/var/lib/clickhouse
    ulimits:
      nofile:
        soft: 262144
        hard: 262144
    healthcheck:
      test: wget -q -O- http://localhost:8123/ping
      interval: 10s
      timeout: 5s
      retries: 10
    networks:
      - crypto-net

  # ─── Grafana ──────────────────────────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.3
    container_name: grafana
    mem_limit: 256m
    depends_on:
      clickhouse:
        condition: service_healthy
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: ${GRAFANA_USER}
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_PASSWORD}
      GF_INSTALL_PLUGINS: grafana-clickhouse-datasource
      GF_USERS_ALLOW_SIGN_UP: 'false'
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning
      - grafana-data:/var/lib/grafana
    networks:
      - crypto-net

  # ─── Kafka Producer ───────────────────────────────────────────────────────────
  kafka-producer:
    build: ./producer
    container_name: kafka-producer
    mem_limit: 256m
    depends_on:
      kafka:
        condition: service_healthy
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: raw_crypto_prices
      POLL_INTERVAL_SECONDS: '30'
    restart: unless-stopped
    networks:
      - crypto-net

  # ─── Spark Streaming ──────────────────────────────────────────────────────────
  spark-streaming:
    build: ./spark_streaming
    container_name: spark-streaming
    mem_limit: 2g
    depends_on:
      kafka:
        condition: service_healthy
      minio:
        condition: service_healthy
      minio-init:
        condition: service_completed_successfully
    environment:
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      KAFKA_TOPIC: raw_crypto_prices
      MINIO_ENDPOINT: http://minio:9000
      MINIO_ACCESS_KEY: ${MINIO_ROOT_USER}
      MINIO_SECRET_KEY: ${MINIO_ROOT_PASSWORD}
    restart: unless-stopped
    networks:
      - crypto-net

# ─── Networks & Volumes ─────────────────────────────────────────────────────────
networks:
  crypto-net:
    driver: bridge

volumes:
  minio-data:
  clickhouse-data:
  airflow-postgres-data:
  airflow-logs:
  airflow-plugins:
  grafana-data:
  iceberg-catalog:
